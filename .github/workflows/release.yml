# Pushing a tag vX.Y.Z publishes that version to crates.io and makes a GitHub release. The tag must match Cargo.toml.
# crates.io trusts this file and the release environment (trusted publishing).
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"
            exit 1
          fi
      # Trusted publishing (OIDC): a short-lived token for this run.
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
