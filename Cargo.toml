[package]
name = "jpeg-xr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A pure-Rust JPEG XR (ITU-T T.832) decoder with no unsafe code and no dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jaxcksn/jpeg-xr"
keywords = ["jpeg-xr", "jxr", "hdphoto", "wdp", "image"]
categories = ["multimedia::images", "encoding"]
readme = "README.md"

# Its own workspace, also when a checkout of it sits inside another one.
[workspace]

[dependencies]

[dev-dependencies]
png = "0.18"

[lints.rust]
missing_docs = "warn"
